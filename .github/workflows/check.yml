name: local-checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: bash scripts/build.sh
      - run: python3 scripts/test_pty.py
      - run: python3 scripts/test_install.py
      - run: python3 scripts/test_win_ui.py
      - run: python3 scripts/test_cli.py
  windows-collector:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: ./scripts/test_windows_probe.ps1
